<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordMate AI</title>

    <style>
        /* 1. 整體外觀：延續舊版的藍白卡片風格 */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #263248;
        }

        .container {
            max-width: 760px;
            margin: 50px auto;
            padding: 24px;
        }

        h1 { color: #3154a3; margin-bottom: 8px; }
        .subtitle { color: #667085; margin-bottom: 28px; }

        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        button {
            background: #3154a3;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled { opacity: 0.6; cursor: not-allowed; }
        button:focus-visible, input:focus-visible, summary:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }

        /* 2. 三個功能切換按鈕 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button { flex: 1; background: #e3e9f5; color: #263248; }
        .tab-button.active { background: #3154a3; color: white; }
        .page[hidden], #quizArea[hidden] { display: none; }

        /* 3. 查詢區 */
        .search { display: flex; gap: 12px; }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        #saveButton { background: #16836b; }
        #saveMessage, .hint { color: #667085; font-size: 14px; }

        /* 4. 字典定義與例句 */
        .dictionary { margin-top: 24px; line-height: 1.7; overflow-wrap: anywhere; }
        .dictionary h3 { font-size: 25px; margin: 0 0 8px; }
        .dictionary h4 { margin: 16px 0 4px; color: #3154a3; }
        .dictionary ul { padding-left: 24px; }
        .dictionary li { margin-bottom: 12px; }
        .dictionary em { display: block; margin-top: 4px; color: #667085; }
        .phonetic { color: #667085; }

        /* 5. 收藏區：預設只顯示單字，點擊後展開 */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .section-header h2 { margin: 0; }
        #refreshButton { background: #667085; }

        .saved-item {
            margin-top: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        .saved-item summary {
            padding: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .saved-content { padding: 0 16px 16px; border-top: 1px solid #e5e7eb; }
        .saved-content .dictionary h3 { font-size: 20px; }
        .delete-button { background: #c63e4c; margin-top: 12px; }

        /* 6. 測驗區 */
        #quizQuestion { margin: 22px 0 16px; line-height: 1.5; }
        #quizScore { color: #3154a3; font-weight: bold; }

        .quiz-option {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            background: #f4f6fb;
            color: #263248;
            border: 1px solid #cbd5e1;
            text-align: left;
        }

        .quiz-option.correct { background: #dcfce7; border-color: #16a34a; }
        .quiz-option.incorrect { background: #fee2e2; border-color: #dc2626; }
        #quizFeedback { min-height: 24px; }

        /* 7. 手機版：窄螢幕時讓搜尋欄直向排列 */
        @media (max-width: 480px) {
            .container { margin: 20px auto; padding: 16px; }
            .card { padding: 20px; }
            .search { flex-direction: column; }
            .tab-button { padding: 12px 5px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>WordMate AI</h1>
        <p class="subtitle">Your personal AI English vocabulary tutor</p>

        <!-- 1. 分頁按鈕。只切換畫面，不重新載入網頁 -->
        <nav class="tabs" aria-label="功能切換">
            <button class="tab-button active" data-page="dictionary">Dictionary</button>
            <button class="tab-button" data-page="saved">My Words</button>
            <button class="tab-button" data-page="quiz">Quiz</button>
        </nav>

        <!-- 2. 字典頁 -->
        <section id="dictionaryPage" class="card page">
            <div class="search">
                <input id="wordInput" type="text" maxlength="80"
                       placeholder="輸入英文單字，例如 implement">
                <button id="searchButton">查詢單字</button>
            </div>
            <div id="result" class="dictionary" aria-live="polite">
                輸入一個英文單字，開始學習！
            </div>
            <div class="actions">
                <button id="saveButton" disabled>☆ 收藏單字</button>
                <span id="saveMessage" aria-live="polite"></span>
            </div>
        </section>

        <!-- 3. 我的收藏頁 -->
        <section id="savedPage" class="card page" hidden>
            <div class="section-header">
                <h2>我的收藏單字</h2>
                <button id="refreshButton">重新整理</button>
            </div>
            <p class="hint">點選單字展開內容，再點一次收合。</p>
            <div id="savedWords" aria-live="polite"></div>
        </section>

        <!-- 4. 測驗頁 -->
        <section id="quizPage" class="card page" hidden>
            <div class="section-header">
                <h2>Vocabulary Quiz</h2>
                <button id="startQuizButton">開始／重新測驗</button>
            </div>
            <p class="hint">至少需要收藏四個有英文定義的單字。</p>
            <div id="quizArea" hidden>
                <p id="quizScore">Score: 0 / 0</p>
                <h3 id="quizQuestion"></h3>
                <div id="quizOptions"></div>
                <p id="quizFeedback" aria-live="polite"></p>
                <button id="nextQuizButton" disabled>下一題</button>
            </div>
        </section>
    </main>

    <script>
        "use strict";

        // 1. 取得網頁元素：每個變數都使用完整名稱，方便閱讀
        const wordInput = document.getElementById("wordInput");
        const searchButton = document.getElementById("searchButton");
        const result = document.getElementById("result");
        const saveButton = document.getElementById("saveButton");
        const saveMessage = document.getElementById("saveMessage");
        const savedWords = document.getElementById("savedWords");
        const refreshButton = document.getElementById("refreshButton");
        const quizArea = document.getElementById("quizArea");
        const quizQuestion = document.getElementById("quizQuestion");
        const quizOptions = document.getElementById("quizOptions");
        const quizFeedback = document.getElementById("quizFeedback");
        const quizScore = document.getElementById("quizScore");
        const nextQuizButton = document.getElementById("nextQuizButton");
        const startQuizButton = document.getElementById("startQuizButton");

        let currentWord = "";
        let currentExplanation = "";
        let correctCount = 0;
        let answeredCount = 0;
        let currentQuestionId = null;
        let currentOptions = [];
        let hasAnswered = false;
        let isLoadingQuestion = false;

        // 2. 分頁切換：只顯示使用者選擇的頁面
        function showPage(pageName) {
            const pageNames = ["dictionary", "saved", "quiz"];

            for (const name of pageNames) {
                document.getElementById(name + "Page").hidden = name !== pageName;
            }

            const tabButtons = document.querySelectorAll(".tab-button");
            for (const button of tabButtons) {
                button.classList.toggle("active", button.dataset.page === pageName);
            }

            if (pageName === "saved") {
                loadSavedWords();
            }
        }

        for (const button of document.querySelectorAll(".tab-button")) {
            button.addEventListener("click", () => showPage(button.dataset.page));
        }

        // 3. 將字典 JSON 轉成 HTML 元素（不要將外部文字直接放進 innerHTML）
        function renderDictionary(dictionary) {
            const container = document.createElement("div");
            container.className = "dictionary";

            const title = document.createElement("h3");
            title.textContent = dictionary.word || "Unknown";
            container.appendChild(title);

            if (dictionary.phonetic) {
                const phonetic = document.createElement("p");
                phonetic.className = "phonetic";
                phonetic.textContent = dictionary.phonetic;
                container.appendChild(phonetic);
            }

            for (const meaning of (dictionary.meanings || [])) {
                const partOfSpeech = document.createElement("h4");
                partOfSpeech.textContent = meaning.partOfSpeech || "unknown";
                container.appendChild(partOfSpeech);

                const list = document.createElement("ul");
                for (const definition of (meaning.definitions || [])) {
                    const item = document.createElement("li");
                    item.appendChild(document.createTextNode(definition.definition || ""));

                    if (definition.example) {
                        const example = document.createElement("em");
                        example.textContent = definition.example;
                        item.appendChild(example);
                    }
                    list.appendChild(item);
                }
                container.appendChild(list);
            }

            const source = document.createElement("p");
            source.className = "hint";
            source.textContent = "Source: " + (dictionary.source || "Dictionary");
            container.appendChild(source);
            return container;
        }

        // 舊版收藏是純文字：相容顯示，不會破壞舊資料
        function renderLegacyExplanation(word, explanation) {
            const container = document.createElement("div");
            container.className = "dictionary";
            const title = document.createElement("h3");
            title.textContent = word;
            const text = document.createElement("p");
            text.textContent = explanation;
            text.style.whiteSpace = "pre-wrap";
            container.append(title, text);
            return container;
        }

        // 4. 查詢字典
        async function searchWord() {
            const word = wordInput.value.trim();
            currentWord = "";
            currentExplanation = "";
            saveButton.disabled = true;
            saveMessage.textContent = "";

            if (!word) {
                result.textContent = "請先輸入英文單字。";
                return;
            }

            searchButton.disabled = true;
            searchButton.textContent = "查詢中...";
            result.textContent = "正在查詢字典...";

            try {
                const response = await fetch("/vocabulary/explain", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ word: word })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "查詢失敗");
                }

                currentWord = data.word;
                currentExplanation = data.explanation;
                result.replaceChildren(renderDictionary(data.dictionary));
                saveButton.disabled = false;
            } catch (error) {
                result.textContent = "查詢失敗：" + error.message;
            } finally {
                searchButton.disabled = false;
                searchButton.textContent = "查詢單字";
            }
        }

        searchButton.addEventListener("click", searchWord);
        wordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") searchWord();
        });

        // 5. 收藏單字。重複收藏由後端回傳 HTTP 409
        async function saveCurrentWord() {
            if (!currentWord || !currentExplanation) return;

            saveButton.disabled = true;
            saveMessage.textContent = "收藏中...";

            try {
                const response = await fetch("/vocabulary/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        word: currentWord,
                        explanation: currentExplanation
                    })
                });

                if (response.status === 409) {
                    saveMessage.textContent = "這個單字已經收藏過了。";
                    return;
                }
                if (!response.ok) throw new Error("收藏失敗");

                saveMessage.textContent = "收藏成功！";
            } catch (error) {
                saveMessage.textContent = error.message;
                saveButton.disabled = false;
            }
        }

        saveButton.addEventListener("click", saveCurrentWord);

        // 6. 刪除收藏：使用資料庫 ID 精確指定紀錄
        async function deleteSavedWord(word, deleteButton) {
            if (!confirm("確定取消收藏「" + word.word + "」嗎？")) return;

            deleteButton.disabled = true;
            try {
                const response = await fetch("/vocabulary/" + word.id, {
                    method: "DELETE"
                });
                if (!response.ok) throw new Error("取消收藏失敗");

                if (currentWord.toLowerCase() === word.word.toLowerCase()) {
                    saveButton.disabled = false;
                    saveMessage.textContent = "已取消收藏，可以重新收藏。";
                }
                await loadSavedWords();
            } catch (error) {
                alert(error.message);
                deleteButton.disabled = false;
            }
        }

        // 7. 讀取收藏：HTML 原生 details / summary 實作展開收合
        async function loadSavedWords() {
            savedWords.textContent = "載入中...";

            try {
                const response = await fetch("/vocabulary/saved");
                if (!response.ok) throw new Error("無法讀取收藏");
                const data = await response.json();

                savedWords.replaceChildren();
                if (data.words.length === 0) {
                    savedWords.textContent = "目前沒有收藏單字。";
                    return;
                }

                for (const word of data.words) {
                    const card = document.createElement("details");
                    card.className = "saved-item";

                    const summary = document.createElement("summary");
                    summary.textContent = word.word;
                    card.appendChild(summary);

                    const content = document.createElement("div");
                    content.className = "saved-content";
                    if (word.dictionary) {
                        content.appendChild(renderDictionary(word.dictionary));
                    } else {
                        content.appendChild(renderLegacyExplanation(word.word, word.explanation));
                    }

                    const deleteButton = document.createElement("button");
                    deleteButton.className = "delete-button";
                    deleteButton.textContent = "取消收藏";
                    deleteButton.addEventListener("click", () => {
                        deleteSavedWord(word, deleteButton);
                    });

                    content.appendChild(deleteButton);
                    card.appendChild(content);
                    savedWords.appendChild(card);
                }
            } catch (error) {
                savedWords.textContent = error.message;
            }
        }

        refreshButton.addEventListener("click", loadSavedWords);

        // 8. 測驗題目
        function updateScore() {
            quizScore.textContent = `Score: ${correctCount} / ${answeredCount}`;
        }

        async function loadQuizQuestion() {
            if (isLoadingQuestion) return;
            isLoadingQuestion = true;
            currentQuestionId = null;
            currentOptions = [];
            hasAnswered = false;
            nextQuizButton.disabled = true;
            quizQuestion.textContent = "載入題目中...";
            quizOptions.replaceChildren();
            quizFeedback.textContent = "";

            try {
                const response = await fetch("/quiz/question");
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "無法取得題目");

                currentQuestionId = data.question_id;
                currentOptions = data.options;
                quizQuestion.textContent = data.question;

                data.options.forEach((option, index) => {
                    const optionButton = document.createElement("button");
                    optionButton.className = "quiz-option";
                    optionButton.textContent = String.fromCharCode(65 + index) + ". " + option;
                    optionButton.addEventListener("click", () => submitQuizAnswer(option));
                    quizOptions.appendChild(optionButton);
                });
            } catch (error) {
                quizQuestion.textContent = "無法開始測驗。";
                quizFeedback.textContent = error.message;
                nextQuizButton.disabled = false;
            } finally {
                isLoadingQuestion = false;
            }
        }

        // 9. 答題、顯示正確與錯誤選項
        async function submitQuizAnswer(selectedAnswer) {
            if (hasAnswered || currentQuestionId === null) return;
            hasAnswered = true;

            const optionButtons = Array.from(quizOptions.querySelectorAll("button"));
            optionButtons.forEach((button) => button.disabled = true);
            quizFeedback.textContent = "檢查答案中...";

            try {
                const response = await fetch("/quiz/answer", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        question_id: currentQuestionId,
                        answer: selectedAnswer
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "檢查答案失敗");

                answeredCount++;
                if (data.correct) correctCount++;
                updateScore();
                quizFeedback.textContent = data.correct
                    ? "Correct!"
                    : "Incorrect. Correct answer: " + data.correct_answer;

                optionButtons.forEach((button, index) => {
                    const option = currentOptions[index];
                    if (option.toLowerCase() === data.correct_answer.toLowerCase()) {
                        button.classList.add("correct");
                    } else if (option === selectedAnswer && !data.correct) {
                        button.classList.add("incorrect");
                    }
                });
                nextQuizButton.disabled = false;
            } catch (error) {
                quizFeedback.textContent = error.message;
                hasAnswered = false;
                optionButtons.forEach((button) => button.disabled = false);
            }
        }

        startQuizButton.addEventListener("click", () => {
            correctCount = 0;
            answeredCount = 0;
            updateScore();
            quizArea.hidden = false;
            loadQuizQuestion();
        });
        nextQuizButton.addEventListener("click", loadQuizQuestion);
    </script>
</body>
</html>
